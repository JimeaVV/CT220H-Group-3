name: fintrack
description: Ứng dụng quản lý chi tiêu cá nhân FinTrack.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  flutter_riverpod: 2.6.1
  dio: ^5.8.0+1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/fintrack_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/fintrack_logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/fintrack_logo.png
  min_sdk_android: 23
